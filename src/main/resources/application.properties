spring.application.name=askmydocs

# =========================================================
# DATABASE - PostgreSQL with pgvector (Docker, port 5433)
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5433/askmydocs
spring.datasource.username=askmydocs
spring.datasource.password=askmydocs

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# =========================================================
# FILE UPLOADS
# =========================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# =========================================================
# SPRING AI - Ollama
# =========================================================

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.embedding.options.model=nomic-embed-text

# =========================================================
# PGVECTOR
# =========================================================

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# =========================================================
# CHUNKING
# =========================================================

askmydocs.chunk.size=800
askmydocs.chunk.overlap=100

# =========================================================
# LOGGING
# =========================================================

logging.level.com.shreyo.askmydocs=DEBUG